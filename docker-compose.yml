services:
  db:
    image: postgres:16-alpine
    container_name: acme_postgres
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acmepassword
      POSTGRES_DB: acme_salary_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_salary_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acme_backend
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bundle exec rails db:prepare &&
               bundle exec rails s -b 0.0.0.0 -p 3001"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3001:3001"
    environment:
      RAILS_ENV: development
      PORT: 3001
      DATABASE_HOST: db
      DATABASE_USER: acme
      DATABASE_PASSWORD: acmepassword
      DATABASE_NAME: acme_salary_development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acme_frontend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:3001
    depends_on:
      - backend

volumes:
  postgres_data:
  bundle_cache:
  frontend_node_modules:
